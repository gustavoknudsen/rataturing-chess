name: release

# Builds the UCI executables on every platform when a version tag is pushed,
# and attaches them to the GitHub release for that tag. PyInstaller cannot
# cross-build, so each archive is made on the platform it runs on. Run it by
# hand from the Actions tab to get the archives as workflow artifacts without
# a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest, macos-13]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Package the engine
        run: python tools/package.py

      - name: Build the executables
        run: python uci/build.py

      - name: Keep the archives
        uses: actions/upload-artifact@v4
        with:
          name: rataturing-${{ matrix.os }}
          path: release/*.zip
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: archives
          merge-multiple: true

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: archives/*.zip
